<title>Computer Systems Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a chip floor-plan. Layers are die regions, subsystems are blocks, concepts are cells;
   a highlighter-amber trace marks selections and scenario paths. */
:root {
  --bg: #e9edf2; --dot: #c7cfd9; --surface: #fbfcfd; --surface-2: #f2f5f8; --ink: #17202b; --muted: #5a6573; --line: #d4dbe3;
  --hl: #f59f00; --hl-ink: #7a4a00; --hl-soft: rgba(245, 159, 0, .18);
  --lay-l: 95%; --lay-s: 42%; --lay-stroke-l: 62%; --lay-title-l: 30%; --card: #ffffff; --chip-l: 92%; --chip-ink: #1d2733;
  --e-data: #3653c9; --e-ctrl: #48525e; --e-dep: #7d8794; --e-repl: #0b8a7a; --e-recov: #d6452f; --e-rel: #8e5bd0;
  --loc-ram: #7c4dff; --loc-disk: #b7791f; --loc-cpu: #e03131; --loc-os: #3b6fd4; --loc-net: #0c8599; --loc-multi: #2f9e44; --loc-logic: #8a939e;
  --st-learning: #f08c00; --st-understood: #2f9e44; --st-revision: #e03131;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 6px 24px rgba(20, 30, 45, .12), 0 1px 3px rgba(20, 30, 45, .10);
  --inv: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --dot: #222b37; --surface: #161d27; --surface-2: #1c2531; --ink: #e2e8f0; --muted: #94a0ae; --line: #2a3542;
  --hl: #ffb020; --hl-ink: #ffd27a; --hl-soft: rgba(255, 176, 32, .16);
  --lay-l: 14%; --lay-s: 30%; --lay-stroke-l: 38%; --lay-title-l: 78%; --card: #1a2230; --chip-l: 22%; --chip-ink: #e6ebf2;
  --e-data: #7d98ff; --e-ctrl: #aab4c0; --e-dep: #6f7a88; --e-repl: #2fc4ad; --e-recov: #ff7a63; --e-rel: #b48cf0;
  --loc-ram: #a98bff; --loc-disk: #e0a84a; --loc-cpu: #ff6b6b; --loc-os: #6f9cff; --loc-net: #3bc9db; --loc-multi: #51cf66; --loc-logic: #8a939e;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141b; --dot: #222b37; --surface: #161d27; --surface-2: #1c2531; --ink: #e2e8f0; --muted: #94a0ae; --line: #2a3542;
  --hl: #ffb020; --hl-ink: #ffd27a; --hl-soft: rgba(255, 176, 32, .16);
  --lay-l: 14%; --lay-s: 30%; --lay-stroke-l: 38%; --lay-title-l: 78%; --card: #1a2230; --chip-l: 22%; --chip-ink: #e6ebf2;
  --e-data: #7d98ff; --e-ctrl: #aab4c0; --e-dep: #6f7a88; --e-repl: #2fc4ad; --e-recov: #ff7a63; --e-rel: #b48cf0;
  --loc-ram: #a98bff; --loc-disk: #e0a84a; --loc-cpu: #ff6b6b; --loc-os: #6f9cff; --loc-net: #3bc9db; --loc-multi: #51cf66; --loc-logic: #8a939e;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }

#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); z-index: 30; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-stretch: 85%; font-weight: 750; font-size: 19px; letter-spacing: .01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.search { position: relative; flex: 1 1 260px; max-width: 460px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); font: inherit; }
.search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 50; padding: 4px; }
.res { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.res[aria-selected="true"], .res:hover { background: var(--hl-soft); }
.res .sw { width: 10px; height: 10px; border-radius: 3px; }
.res .rn { font-weight: 600; } .res .rs { color: var(--muted); font-size: 12px; display: block; }
.res .rk { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tb { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.tb:hover { border-color: var(--muted); }
.tb[aria-pressed="true"] { background: var(--hl-soft); border-color: var(--hl); color: var(--ink); }
.progress { font-size: 12px; color: var(--muted); font-family: var(--f-mono); white-space: nowrap; }

#main { position: relative; flex: 1; min-height: 0; }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); }
#stage.dragging { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }

/* --- map elements --- */
.lbody { fill: hsl(var(--h) var(--lay-s) var(--lay-l)); stroke: hsl(var(--h) 45% var(--lay-stroke-l)); stroke-width: calc(1.6px * var(--inv)); }
.ltitle { font-family: var(--f-display); font-stretch: 80%; font-weight: 780; font-size: 56px; fill: hsl(var(--h) 55% var(--lay-title-l)); cursor: pointer; }
.lod0 .ltitle { font-size: var(--tsz0, 72px); }
.lod0 .ltag { font-size: 38px; }
.lod0 .lcode { display: none; }
.lod2 .ltitle { font-size: 44px; }
.lod2 .ltag { font-size: 24px; }
.ltag { font-family: var(--f-body); font-size: 30px; fill: hsl(var(--h) 25% var(--lay-title-l)); opacity: .85; pointer-events: none; }
.lcode { font-family: var(--f-mono); font-size: 24px; fill: hsl(var(--h) 35% var(--lay-title-l)); opacity: .7; pointer-events: none; }
.gbody { fill: var(--card); stroke: hsl(var(--h) 35% var(--lay-stroke-l)); stroke-width: calc(1px * var(--inv)); }
.gtitle { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 21px; fill: hsl(var(--h) 50% var(--lay-title-l)); }
.gcount { font-family: var(--f-mono); font-size: 15px; fill: var(--muted); }
.gtoggle { font-family: var(--f-mono); font-size: 18px; fill: var(--muted); }
.ghead { cursor: pointer; }
.ghead rect { fill: transparent; }
.ghead:hover .gtitle { text-decoration: underline; }
.nbody { fill: hsl(var(--h) 55% var(--chip-l)); stroke: hsl(var(--h) 40% var(--lay-stroke-l)); stroke-width: calc(.8px * var(--inv)); }
.node { cursor: pointer; }
.node:hover .nbody { stroke: var(--ink); }
.ntext { font-family: var(--f-body); font-size: 14.5px; font-weight: 500; fill: var(--chip-ink); pointer-events: none; }
.ldot { stroke: var(--card); stroke-width: 1.2px; }
.nstat { fill: transparent; }
.node.st-learning .nstat { fill: var(--st-learning); } .node.st-understood .nstat { fill: var(--st-understood); } .node.st-revision .nstat { fill: var(--st-revision); }

/* level of detail */
.lod0 .gtitle, .lod0 .gcount, .lod0 .gtoggle, .lod0 .node { display: none; }
.lod0 .gbody { fill: hsl(var(--h) 40% var(--chip-l)); opacity: .6; }
.lod1 .ntext, .lod1 .ldot, .lod1 .nstat { display: none; }
.lod1 .nbody { stroke: none; }
.lod1 .node.sel .nbody, .lod1 .node.nb .nbody, .lod1 .node.scen .nbody { stroke: var(--hl); }
.group.collapsed .node { display: none; }

/* states */
.sel > .lbody, .sel > .gbody, .node.sel .nbody { stroke: var(--hl) !important; stroke-width: calc(3.5px * var(--inv)) !important; }
.node.nb .nbody { stroke: var(--hl); stroke-width: calc(1.6px * var(--inv)); }
.node.scen .nbody { stroke: var(--hl); stroke-width: calc(2.4px * var(--inv)); }
.node.hit .nbody { fill: var(--hl-soft); }
.dim { opacity: .14; }
.node.dim { opacity: .18; }

/* edges */
.edge { fill: none; stroke-linecap: round; pointer-events: none; }
.edge.base { stroke-width: calc(1.3px * var(--inv)); opacity: .55; }
.edge.hi { stroke-width: calc(2.4px * var(--inv)); opacity: 1; }
.e-data { stroke: var(--e-data); }
.e-ctrl { stroke: var(--e-ctrl); stroke-dasharray: calc(9px * var(--inv)) calc(5px * var(--inv)); }
.e-dep { stroke: var(--e-dep); stroke-dasharray: calc(2px * var(--inv)) calc(5px * var(--inv)); }
.e-repl { stroke: var(--e-repl); }
.edge.base.e-repl { stroke-width: calc(3.4px * var(--inv)); }
.edge.hi.e-repl { stroke-width: calc(5px * var(--inv)); }
.e-repl-in { stroke: var(--bg); stroke-width: calc(1.4px * var(--inv)) !important; opacity: 1 !important; }
.e-recov { stroke: var(--e-recov); stroke-dasharray: calc(11px * var(--inv)) calc(4px * var(--inv)) calc(2px * var(--inv)) calc(4px * var(--inv)); }
.e-rel { stroke: var(--e-rel); stroke-dasharray: calc(3px * var(--inv)) calc(4px * var(--inv)); }
.ehit { fill: none; stroke: transparent; stroke-width: calc(14px * var(--inv)); pointer-events: stroke; cursor: pointer; }
.ehit:hover + .edge, .edge.hover { opacity: 1; }
.elabel { font-family: var(--f-body); font-size: calc(12px * var(--inv)); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: calc(4px * var(--inv)); stroke-linejoin: round; pointer-events: none; }
.elabel.big { font-size: calc(13px * var(--inv)); font-weight: 600; }
.mk-data { fill: var(--e-data); } .mk-ctrl { fill: var(--e-ctrl); } .mk-dep { fill: var(--e-dep); } .mk-repl { fill: var(--e-repl); } .mk-recov { fill: var(--e-recov); } .mk-rel { fill: var(--e-rel); }

/* scenario path */
.spath { fill: none; stroke: var(--hl); stroke-width: calc(6px * var(--inv)); stroke-linejoin: round; stroke-linecap: round; opacity: .55; pointer-events: none; }
.sdot circle { fill: var(--surface); stroke: var(--hl); stroke-width: calc(2.5px * var(--inv)); }
.sdot.cur circle { fill: var(--hl); }
.sdot text { font-family: var(--f-mono); font-weight: 500; font-size: calc(12px * var(--inv)); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.sdot { cursor: pointer; }

/* --- floating UI --- */
.panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 20; display: flex; flex-direction: column; }
.panel .phead { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.panel .pbody { padding: 14px 18px 24px; overflow: auto; flex: 1; min-width: 0; }
.close { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.close:hover { background: var(--surface-2); }
.crumbs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding-right: 30px; }
.crumbs button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.ptitle { font-family: var(--f-display); font-stretch: 85%; font-weight: 760; font-size: 26px; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.pab { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.loc { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px 2px 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface-2); }
.loc i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.lnote { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.own { font-size: 12.5px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.act { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.act:hover { border-color: var(--muted); }
.act.on { background: var(--hl-soft); border-color: var(--hl); }
.status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.status button { border: 0; border-right: 1px solid var(--line); background: var(--surface-2); padding: 6px 4px; font-size: 12px; cursor: pointer; }
.status button:last-child { border-right: 0; }
.status button[aria-pressed="true"] { background: var(--hl-soft); font-weight: 600; }
.sec { margin-top: 18px; }
.sec h3 { font-family: var(--f-display); font-stretch: 90%; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.sec p { margin: 0; line-height: 1.55; max-width: 65ch; }
.sec ol, .sec ul { margin: 0; padding-left: 20px; line-height: 1.5; }
.sec li { margin: 3px 0; }
.sec pre { font-family: var(--f-mono); font-size: 12px; line-height: 1.35; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.pro li::marker { content: "+  "; color: var(--st-understood); font-weight: 700; }
.con li::marker { content: "−  "; color: var(--st-revision); font-weight: 700; }
.callout { border-left: 3px solid var(--hl); background: var(--hl-soft); padding: 8px 10px; border-radius: 0 6px 6px 0; }
.links { display: flex; flex-direction: column; gap: 4px; }
.lk { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; text-align: left; border: 0; background: none; padding: 4px 4px; border-radius: 6px; cursor: pointer; }
.lk:hover { background: var(--surface-2); }
.lk .lkn { font-weight: 600; }
.lk .lks { display: block; color: var(--muted); font-size: 12px; }
.lk svg { margin-top: 3px; }
.pill { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tagbtn { display: inline-block; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 3px 10px; margin: 0 6px 6px 0; font-size: 12.5px; cursor: pointer; }
.tagbtn:hover { border-color: var(--muted); }
.ncount { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }

.side { position: absolute; top: 0; left: 0; bottom: 0; width: min(380px, 100%); background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow); z-index: 21; display: flex; flex-direction: column; }
.side .phead { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.side .pbody { padding: 10px 12px 20px; overflow: auto; flex: 1; }
.scen { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.scen:hover { border-color: var(--hl); }
.scen b { font-family: var(--f-display); font-stretch: 88%; font-size: 15.5px; display: block; }
.scen span { color: var(--muted); font-size: 12.5px; }
.steps { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: st; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
.steps li:hover { background: var(--surface-2); }
.steps li.cur { background: var(--hl-soft); }
.steps .no { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hl); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; }
.steps li.cur .no { background: var(--hl); color: #1b1300; }
.steps .sn { font-weight: 600; display: block; }
.steps .st { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.steps li.cur .st { color: var(--ink); }
.snav { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
.snav .act { flex: 1; text-align: center; }

#minimap { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: 210px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 15; padding: 6px; }
#minimap svg { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
.mm-l { fill: hsl(var(--h) 45% var(--chip-l)); stroke: hsl(var(--h) 40% var(--lay-stroke-l)); stroke-width: 8; }
.mm-t { font-family: var(--f-display); font-size: 300px; font-weight: 750; fill: hsl(var(--h) 50% var(--lay-title-l)); pointer-events: none; }
.mm-v { fill: var(--hl-soft); stroke: var(--hl); stroke-width: 22; }
.mmcap { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; padding: 0 2px 4px; }

#zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 15; display: flex; flex-direction: column; gap: 4px; }
#zoom button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer; font-size: 18px; box-shadow: var(--shadow); }
#zoom .lvl { font-family: var(--f-mono); font-size: 10px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 0; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 12.5px; color: var(--muted); box-shadow: var(--shadow); z-index: 14; white-space: nowrap; max-width: calc(100% - 520px); overflow: hidden; text-overflow: ellipsis; }

.modal-back { position: absolute; inset: 0; background: rgba(10, 15, 22, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(1180px, 100%); max-height: 100%; display: grid; grid-template-columns: 270px 1fr; overflow: hidden; position: relative; }
.modal .mlist { border-right: 1px solid var(--line); overflow: auto; padding: 12px; max-height: 86vh; }
.modal .mview { overflow: auto; padding: 18px 22px; max-height: 86vh; min-width: 0; }
.mitem { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.mitem:hover { background: var(--surface-2); } .mitem.on { background: var(--hl-soft); font-weight: 600; }
.ctable-wrap { overflow-x: auto; margin-top: 12px; }
.ctable { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
.ctable th, .ctable td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; line-height: 1.45; }
.ctable thead th { background: var(--surface-2); }
.ctable tbody th { font-family: var(--f-display); font-stretch: 90%; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 130px; background: var(--surface-2); }
.ctable thead button { border: 0; background: none; padding: 0; font-weight: 700; cursor: pointer; text-align: left; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.legend { position: absolute; top: 10px; right: 10px; width: min(360px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 35; padding: 14px 16px; }
.legend h3 { font-family: var(--f-display); font-stretch: 90%; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.legend h3:first-of-type { margin-top: 0; }
.lrow { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.lrow small { color: var(--muted); display: block; }
